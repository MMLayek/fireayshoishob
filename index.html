<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background:radial-gradient(circle at top,#1e293b,#020617 65%);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  color:#fff;
  overflow-x:hidden;
  overflow-y:auto;
}

/* animated background */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle,rgba(99,102,241,.25),transparent 35%),
    radial-gradient(circle at bottom,rgba(236,72,153,.25),transparent 35%);
  animation:bgMove 20s linear infinite;
  z-index:-1;
}
@keyframes bgMove{to{transform:rotate(360deg)}}

/* card */
.card{
  width:100%;
  max-width:430px;
  margin:60px 0;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  border-radius:26px;
  box-shadow:0 40px 80px rgba(0,0,0,.6);
  overflow:hidden;
  animation:fadeUp .9s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1}
}

/* cover */
.cover{
  height:300px;
  background:url("https://routenote-push.s3.eu-west-2.amazonaws.com/221560/3835335a-a7ea-4738-a5aa-6771f1c0649c") center/cover;
  position:relative;
}
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
}

/* content */
.content{
  padding:26px;
  text-align:center;
}

h1{
  font-size:1.7rem;
  font-weight:800;
}

/* info box */
.info-box{
  margin:18px auto 0;
  padding:16px 20px;
  border-radius:18px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  animation:pulse 3s ease-in-out infinite alternate;
}
@keyframes pulse{
  from{box-shadow:0 0 14px rgba(99,102,241,.3)}
  to{box-shadow:0 0 28px rgba(236,72,153,.45)}
}
.artist{font-weight:600;font-size:.95rem}
.release{font-size:.85rem;color:#a5b4fc;margin-top:4px}

/* equalizer */
.equalizer{
  display:flex;
  justify-content:center;
  gap:4px;
  margin:18px 0 14px;
}
.bar{
  width:4px;
  height:24px;
  background:#1ED760;
  border-radius:4px;
  animation:beat 1s infinite ease-in-out;
}
.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
@keyframes beat{
  0%,100%{height:8px}
  50%{height:28px}
}

/* listen buttons */
.links{
  margin-top:20px;
  display:grid;
  gap:14px;
}
.btn{
  padding:15px;
  border-radius:999px;
  font-weight:700;
  text-decoration:none;
  transition:.3s ease;
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%);
  transition:.6s;
}
.btn:hover::after{transform:translateX(100%)}
.btn:hover{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 18px 45px rgba(0,0,0,.55);
}

.spotify{background:#1ED760;color:#000}
.deezer{background:#000;color:#fff}
.apple{background:#ff233d;color:#fff}
.amazon{background:#ffa500;color:#000}

/* follow section */
.follow{
  margin-top:30px;
  padding:22px;
  border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.18);
}
.follow h2{
  font-size:1rem;
  margin-bottom:16px;
  text-align:left;
}
.follow-grid{
  display:grid;
  gap:12px;
}
.follow-btn{
  padding:14px 18px;
  border-radius:16px;
  background:rgba(0,0,0,.45);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  border:1px solid rgba(255,255,255,.2);
  transition:.3s ease;
}
.follow-btn:hover{
  background:linear-gradient(135deg,#1e293b,#111827);
  transform:translateY(-2px);
  box-shadow:0 14px 34px rgba(99,102,241,.45);
}

/* footer */
footer{
  background:#000;
  text-align:center;
  font-size:.75rem;
  padding:12px;
  opacity:.85;
}
</style>
